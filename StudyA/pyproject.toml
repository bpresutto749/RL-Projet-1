[project]
name = "rl-overestimation-lunarlander"
version = "1.0.0"
description = "DDPG vs TD3 on LunarLanderContinuous: layer normalization, overestimation bias and performance"
requires-python = ">=3.12,<3.13"
# Direct dependencies, pinned to the versions of requirements.txt (uv.lock pins all the others).
dependencies = [
    "torch==2.14.1",
    "gymnasium==1.3.0",
    "box2d==2.3.10",
    "swig==4.5.0",
    "numpy==2.5.3",
    "matplotlib==3.11.2",
    "tensorboard==2.21.0",
    "pygame-ce==2.5.8",
    "tqdm==4.70.1",
]

[tool.uv]
package = false   # scripts only, nothing to build

# CUDA 13.0 build of PyTorch on Windows and Linux (as used for the study);
# macOS has no CUDA, so it gets the regular PyPI build (CPU).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
